executor: slurm
use-envmodules: true
use-conda: true
jobs: 50
local-cores: 1
latency-wait: 120
printshellcmds: true
rerun-incomplete: true
keep-going: true
restart-times: 0
max-jobs-per-second: 1
max-status-checks-per-second: 0.1
slurm-keep-successful-logs: true 
verbose: true
use-singularity: true

rerun-triggers:
    - mtime
    #- params               # if parameters change
    #- input                # if input name changes
    #- software-env         # If conda env changes
    #- code                 # if 

default-resources:
    slurm_partition: 'norm'
    slurm_account: 'cookson'
    runtime: 1h
    tasks: 1
    cpus_per_task: 1
    mem_mb: 8000
set-resources:
    run_cellranger:
        runtime: 16h
        cpus_per_task: 12
        tasks: 1
        mem_mb: 40000
        gres: 'lscratch:500'
    run_cellbender:
        slurm_partition: gpu
        runtime: 8h
        cpus_per_task: 2
        tasks: 1
        mem_mb: 32000
        gres: gpu:a100:1
    cellsnp_lite:
        slurm_partition: norm
        runtime: 6h
        cpus_per_task: 10
        tasks: 1
        mem_mb: 96000
        gres: lscratch:80
